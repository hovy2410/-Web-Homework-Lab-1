<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infinite Scrolling Marquee</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Infinite Scrolling Marquee</h1>
    <p class="subtitle">Hover the banner to pause it</p>

    <!-- Khung chứa Banner Marquee -->
    <div class="marquee-container">
      <div class="marquee-track">
        
        <!-- Tập hợp item thứ nhất -->
        <div class="marquee-group">
          <span class="item">HTML</span>
          <span class="item">CSS</span>
          <span class="item">JavaScript</span>
          <span class="item">Git</span>
          <span class="item">GitHub</span>
          <span class="item">VS Code</span>
        </div>

        <!-- Tập hợp item thứ hai (nhân bản giống hệt nhóm 1 để tạo hiệu ứng nối đuôi vô tận không bị giật) -->
        <div class="marquee-group">
          <span class="item">HTML</span>
          <span class="item">CSS</span>
          <span class="item">JavaScript</span>
          <span class="item">Git</span>
          <span class="item">GitHub</span>
          <span class="item">VS Code</span>
        </div>

      </div>
    </div>
  </div>

</body>
</html>
