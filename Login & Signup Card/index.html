<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Sign-up Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Khung nền ngoài cùng -->
  <div class="page-canvas">
    <!-- Card chính 2 cột -->
    <div class="card-container">
      
      <!-- Cột bên trái: Form đăng nhập -->
      <div class="form-panel">
        <h2 class="title">Welcome back</h2>
        <p class="subtitle">Sign in to continue</p>

        <form autocomplete="off">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@example.com">
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" value="12345678" placeholder="••••••••">
          </div>

          <div class="remember-me">
            <input type="checkbox" id="remember">
            <label for="remember">Remember me</label>
          </div>

          <button type="button" class="btn-submit">Sign In</button>
        </form>
      </div>

      <!-- Cột bên phải: Panel xanh trang trí -->
      <div class="decorative-panel">
        <h2>Hello, Friend!</h2>
        <p>Join our community and start building amazing web projects today.</p>
      </div>

    </div>
  </div>

</body>
</html>
